name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CertMaster.sln -c Release

      - name: Test
        run: dotnet test CertMaster.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup -y --no-progress

      - name: Publish and build installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./build/publish.ps1 -SkipTests

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installers/*.exe
          generate_release_notes: true
